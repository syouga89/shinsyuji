<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>フォントプレビュー</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Noto+Serif+JP:wght@700&family=Zen+Old+Mincho:wght@700&family=Kaisei+Tokumin:wght@700&family=Yuji+Syuku&family=Hina+Mincho&display=swap" rel="stylesheet">
  <style>
    body { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2rem; padding: 3rem; font-size: 1rem; }
    .item { text-align: center; }
    .label { font-size: .85rem; color: #aaa; margin-bottom: .5rem; letter-spacing: .1em; }
    .sample { font-size: 4rem; letter-spacing: .3em; }
    hr { width: 300px; border-color: #444; }
    .f1 { font-family: "Shippori Mincho B1", serif; font-weight: 800; }
    .f2 { font-family: "Noto Serif JP", serif; font-weight: 700; }
    .f3 { font-family: "Zen Old Mincho", serif; font-weight: 700; }
    .f4 { font-family: "Kaisei Tokumin", serif; font-weight: 700; }
    .f5 { font-family: "Yuji Syuku", serif; }
    .f6 { font-family: "Hina Mincho", serif; }
  </style>
</head>
<body>
  <div class="item"><div class="label">① 現在 — Shippori Mincho B1</div><div class="sample f1">斟珠寺</div></div>
  <hr>
  <div class="item"><div class="label">② Noto Serif JP</div><div class="sample f2">斟珠寺</div></div>
  <hr>
  <div class="item"><div class="label">③ Zen Old Mincho</div><div class="sample f3">斟珠寺</div></div>
  <hr>
  <div class="item"><div class="label">④ Kaisei Tokumin</div><div class="sample f4">斟珠寺</div></div>
  <hr>
  <div class="item"><div class="label">⑤ Yuji Syuku</div><div class="sample f5">斟珠寺</div></div>
  <hr>
  <div class="item"><div class="label">⑥ Hina Mincho</div><div class="sample f6">斟珠寺</div></div>
</body>
</html>
